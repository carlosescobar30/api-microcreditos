spring.application.name=apimicrocreditos

spring.jpa.open-in-view=false


#logs hibernate/sql
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#scrip data_SQL
spring.sql.init.mode=never

#logs

logging.level.root=INFO
server.error.include-stacktrace=never
logging.level.org.springframework.web=debug

#flyway
spring.flyway.enabled=false

#jwt (only for test)
security.jwt.secret-key=SX8FsAvBsAUgT99ktn7MQ9qdIfOLoRPBwjoaE+7wYC0=
security.jwt.expiration=5m

#refresh token
security.refresh-token.expiration=7d
security.refresh-token.grace-period=5s

#jobs
security.refresh-token.cleanup-cron=0 0 3 * * *